<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Points Game</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .game {
      background: #1f2937;
      width: 420px;
      max-width: 90%;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }

    h1 {
      margin-top: 0;
    }

    .points {
      font-size: 24px;
      font-weight: bold;
      margin: 20px;
    }

    .problem {
      font-size: 42px;
      font-weight: bold;
      margin: 30px 0;
    }

    input, select, button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      box-sizing: border-box;
      border-radius: 10px;
      border: none;
      font-size: 18px;
    }

    input, select {
      background: #374151;
      color: white;
    }

    button {
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #message {
      min-height: 25px;
      margin-top: 15px;
      font-weight: bold;
    }

    .settings {
      margin-top: 25px;
      padding: 15px;
      background: #111827;
      border-radius: 12px;
    }

    .locked {
      color: #9ca3af;
    }

    #settingsControls {
      display: none;
    }
  </style>
</head>

<body>

  <div class="game">

    <h1>🧮 Math Points</h1>

    <p>Get <b>20 points</b> for every correct answer!</p>

    <div class="points">
      Points: <span id="points">0</span>
    </div>

    <div class="problem" id="problem">
      1 + 1 = ?
    </div>

    <input
      id="answer"
      type="number"
      placeholder="Your answer"
      autocomplete="off"
    >

    <button onclick="checkAnswer()">
      Submit Answer
    </button>

    <div id="message"></div>

    <div class="settings">

      <h2>⚙️ Math Settings</h2>

      <div id="lockedMessage" class="locked">
        🔒 Get 100 points to unlock!
      </div>

      <div id="settingsControls">

        <label>Math Type:</label>

        <select id="operation" onchange="newProblem()">
          <option value="addition">Addition</option>
          <option value="subtraction">Subtraction</option>
          <option value="multiplication">Multiplication</option>
          <option value="mixed">Mixed</option>
        </select>

        <label>Difficulty:</label>

        <select id="difficulty" onchange="newProblem()">
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>

      </div>

    </div>

  </div>

  <script>

    let points = 0;
    let correctAnswer = 0;

    const pointsDisplay = document.getElementById("points");
    const problemDisplay = document.getElementById("problem");
    const answerInput = document.getElementById("answer");
    const message = document.getElementById("message");

    function randomNumber(max) {
      return Math.floor(Math.random() * max) + 1;
    }

    function newProblem() {

      let max = 10;

      // Difficulty
      if (points >= 100) {

        const difficulty =
          document.getElementById("difficulty").value;

        if (difficulty === "medium") {
          max = 25;
        }

        if (difficulty === "hard") {
          max = 100;
        }
      }

      // Math type
      let operation = "addition";

      if (points >= 100) {
        operation =
          document.getElementById("operation").value;
      }

      if (operation === "mixed") {

        const types = [
          "addition",
          "subtraction",
          "multiplication"
        ];

        operation =
          types[Math.floor(Math.random() * types.length)];
      }

      let a = randomNumber(max);
      let b = randomNumber(max);

      // Addition
      if (operation === "addition") {

        correctAnswer = a + b;

        problemDisplay.textContent =
          `${a} + ${b} = ?`;
      }

      // Subtraction
      if (operation === "subtraction") {

        // Keep answer positive
        if (b > a) {
          [a, b] = [b, a];
        }

        correctAnswer = a - b;

        problemDisplay.textContent =
          `${a} − ${b} = ?`;
      }

      // Multiplication
      if (operation === "multiplication") {

        // Keep multiplication reasonable
        a = randomNumber(Math.min(max, 12));
        b = randomNumber(Math.min(max, 12));

        correctAnswer = a * b;

        problemDisplay.textContent =
          `${a} × ${b} = ?`;
      }

      answerInput.value = "";
      answerInput.focus();
    }

    function checkAnswer() {

      const answer = Number(answerInput.value);

      if (answerInput.value === "") {
        message.textContent = "Enter an answer!";
        return;
      }

      if (answer === correctAnswer) {

        points += 20;

        pointsDisplay.textContent = points;

        message.textContent =
          "✅ Correct! +20 points!";

        // Unlock settings
        if (points >= 100) {

          document.getElementById(
            "lockedMessage"
          ).style.display = "none";

          document.getElementById(
            "settingsControls"
          ).style.display = "block";
        }

        setTimeout(newProblem, 500);

      } else {

        message.textContent =
          "❌ Wrong! Try again!";
      }
    }

    // Press Enter to submit
    answerInput.addEventListener("keydown", function(event) {

      if (event.key === "Enter") {
        checkAnswer();
      }

    });

    // Start game
    newProblem();

  </script>

</body>
</html>
